{% extends "base.html" %}
{% block title %}New import - Soulseek Curator{% endblock %}
{% block content %}
<section class="panel">
  <h1>New import</h1>
  <form action="/imports" method="post" enctype="multipart/form-data" class="form">
    <label>
      List file
      <input type="file" name="upload" accept=".csv,.txt,.md,.markdown,.json" required>
    </label>
    <label>
      Mode
      <select name="mode">
        <option value="dry-run">Dry-run only</option>
        <option value="queue">Queue selected matches</option>
      </select>
      <small>Queue mode also requires automatic queueing enabled in Settings.</small>
    </label>
    <label>
      Preferred quality
      <select name="quality">
        {% for name in config.quality_profiles.keys() %}
        <option value="{{ name }}" {{ 'selected' if name == 'flac' else '' }}>{{ name }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      Fallback order
      <input name="fallback_order" value="{{ config.fallback_order|join(',') }}">
    </label>
    <label>
      Destination folder inside slskd downloads
      <input name="target_root" placeholder="Example: BBQ/verano-2026">
      <small>Leave empty to download by category at the slskd root. This is not a local filesystem path.</small>
    </label>
    <label class="check">
      <input type="checkbox" name="deep_lossless_search" {{ 'checked' if config.deep_lossless_search else '' }}>
      Deep lossless search
      <small>Also tries format-specific FLAC/WAV searches before falling back to MP3.</small>
    </label>
    <button class="button primary" type="submit">Start import</button>
  </form>
</section>
{% endblock %}
