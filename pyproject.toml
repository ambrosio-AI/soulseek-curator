[project]
name = "soulseek-curator"
version = "0.1.0"
description = "Local web curator for lawful slskd/Soulseek list imports, quality fallback, review, queueing, and reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ambrosio AI" }]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
soulseek-curator = "curator.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-data]
curator = ["templates/*.html", "static/*.css"]
